
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- Permite usar acentos e caracteres especiais -->
    <meta charset="UTF-8">

    <!-- Faz a página se adaptar a diferentes tamanhos de tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título da página -->
    <title>Meu Ritmo | Planner simples, acessível e no teu tempo</title>

    <!-- Descrição que pode aparecer nos resultados de busca -->
    <meta name="description"
        content="Meu Ritmo é um planner simples, acessível e acolhedor para organizar tarefas, passos e compromissos no teu ritmo.">

    <!-- Define o autor do projeto -->
    <meta name="author" content="Caroline Paiva Teixeira">

    <!-- Ajuda a controlar como a página aparece quando compartilhada -->
    <meta property="og:title" content="Meu Ritmo | Planner simples, acessível e no teu tempo">

    <meta property="og:description"
        content="Meu Ritmo é um planner simples, acessível e acolhedor para organizar tarefas, passos e compromissos no teu ritmo.">

    <meta property="og:type" content="website">

    <!-- LINK DO CSS -->
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <header>
    </header>

    <main>

        <h1>Uma tarefa de cada vez. Um passo de cada vez. No teu ritmo. 💜</h1>

        <h2>O que tu quer fazer?</h2>

        <input type="text" placeholder="O que tu quer começar? 🌱">

        <button>Adicionar</button>

        <!-- Aqui aparecerão as tarefas adicionadas pelo JavaScript -->
        <ul id="taskList"></ul>

    </main>

    <footer>
    </footer>

    <!-- LINK DO JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
